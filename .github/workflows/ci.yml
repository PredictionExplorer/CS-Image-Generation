name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  python:
    name: Python (ruff + mypy + unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev tools
        run: pip install ".[dev]"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      # run.py's sync policy (backfill modes, retry cap, failure ledger, exit-status handling),
      # with stub generator, ssh and scp; stdlib unittest only.
      - name: Unit tests
        run: python -m unittest discover -s tests/python -v

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # The tests that render a package or encode the ember videos need FFmpeg (with ffprobe) and,
  # because GitHub sets CI=true, fail instead of skipping when it is missing, so every job that
  # runs the test suite installs it.
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --release

  # The workflow-level RUSTFLAGS replaces the target rustflags in
  # .cargo/config.toml, so every other job builds for baseline x86-64 and never
  # compiles the AVX2 kernel in src/spectrum_simd.rs that production x86 builds
  # use. x86-64-v3 (AVX2 + FMA) stands in for config.toml's target-cpu=native:
  # it enables the same kernel but stays valid when rust-cache restores build
  # artifacts on a runner with a different CPU. The full test run includes the
  # ember golden digests (tests/ember_determinism.rs), so it also checks that the
  # ember edition renders the same bits under AVX2/FMA code generation.
  test-x86-avx2:
    name: Clippy + Tests (x86-64 AVX2)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3 -C target-feature=+avx2,+fma"
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Check the AVX2 + FMA kernel is enabled
        run: |
          rustc --print cfg $RUSTFLAGS | grep -qx 'target_feature="avx2"'
          rustc --print cfg $RUSTFLAGS | grep -qx 'target_feature="fma"'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --release --lcov --output-path lcov.info
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  bench-compile:
    name: Benchmarks (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items

  # Audits the committed Cargo.lock against the RustSec advisory database: fails on any
  # vulnerability; unmaintained/unsound notices are reported as warnings. A prebuilt cargo-audit
  # needs neither a compile under the pinned toolchain nor the checks: write permission that
  # rustsec/audit-check's check run required (its job failed with "Resource not accessible by
  # integration" under this workflow's read-only token).
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
