<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --ink: #d8d8de; --dim: #6a6a72; --accent: __ACCENT__; }
  html, body { margin: 0; height: 100%; background: #030307; overflow: hidden;
    font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--ink); }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; left: 14px; bottom: 12px; user-select: none; }
  #hud .row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  #hud label { color: var(--dim); letter-spacing: 0.08em; }
  #hud input[type=range] { width: 220px; accent-color: var(--accent); }
  #hud button { background: none; border: 1px solid var(--dim); color: var(--ink);
    font: inherit; padding: 2px 8px; cursor: pointer; }
  #hud button.off { color: var(--dim); border-color: #333; }
  #hud button.hot { color: #0a0a0f; background: var(--accent); border-color: var(--accent); }
  #title { position: fixed; left: 14px; top: 12px; letter-spacing: 0.12em; color: var(--dim); }
  #title b { color: var(--ink); font-weight: 500; }
  #hint { position: fixed; right: 14px; top: 12px; color: var(--dim); text-align: right;
    letter-spacing: 0.06em; }
  #meter { position: fixed; right: 14px; bottom: 12px; color: var(--dim);
    letter-spacing: 0.08em; text-align: right; }
  #meter b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="title"><b>__TITLE__</b> &middot; play your orbit</div>
<div id="hint">drag canvas or TIME = bow &middot; wheel = zoom &middot; right-drag = orbit<br>
keys 1 / 2 / 3 solo a body &middot; S scope &middot; R record</div>
<div id="hud">
  <div class="row">
    <label>TIME</label><input id="time" type="range" min="0" max="1" step="0.0002" value="0">
    <button id="orbit" class="off">AUTO-ORBIT</button>
    <button id="scope" class="off">SCOPE</button>
  </div>
  <div class="row">
    <label>EXPOSURE</label><input id="exposure" type="range" min="0.2" max="4" step="0.01" value="1">
    <button id="b0">BODY 1</button><button id="b1">BODY 2</button><button id="b2">BODY 3</button>
    <button id="record">&#9679; RECORD</button>
  </div>
</div>
<div id="meter">bow <b id="pressure">0.00</b> &middot; chord <b id="chord">&mdash;</b></div>
<script>
"use strict";
// ---- embedded data --------------------------------------------------------
// Trajectory: packed little-endian records per point (V53 schema):
//   u16 x, y, z, t, speed  (bbox/65535 normalized)  + u8 r, g, b, pad
// Score (V16's exact mapping, one truth): per-voice note segments
//   [startHop, endHop, num, den, octave] over SCORE.hops hops, plus the
//   consonance curve as delta-encoded u8 (base64).
const META = __META__;
const SCORE = __SCORE__;
const B64 = "__DATA_B64__";
function decodeB64(b64) {
  const raw = atob(b64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return bytes;
}
const bytes = decodeB64(B64);
const REC = 14;
const view = new DataView(bytes.buffer);
// Consonance: first byte absolute, then two's-complement deltas.
const consonance = (() => {
  const packed = decodeB64(SCORE.consonance_b64);
  const out = new Float32Array(packed.length);
  let acc = 0;
  for (let i = 0; i < packed.length; i++) {
    acc = i === 0 ? packed[0] : (acc + (packed[i] << 24 >> 24)) & 255;
    out[i] = acc / 255;
  }
  return out;
})();

// ---- geometry: expand each polyline segment into a screen-space quad ------
const positions = [], sides = [], colors = [], times = [], next = [], speeds = [], indices = [];
let vertexCount = 0;
const bodyRanges = META.bodies.map(() => [0, 0]);
let cursor = 0;
for (let b = 0; b < META.bodies.length; b++) {
  const count = META.bodies[b];
  const start = indices.length;
  for (let i = 0; i < count - 1; i++) {
    const at = (cursor + i) * REC, an = (cursor + i + 1) * REC;
    const px = [view.getUint16(at, true), view.getUint16(at + 2, true), view.getUint16(at + 4, true)];
    const nx = [view.getUint16(an, true), view.getUint16(an + 2, true), view.getUint16(an + 4, true)];
    const t0 = view.getUint16(at + 6, true) / 65535, t1 = view.getUint16(an + 6, true) / 65535;
    const s0 = view.getUint16(at + 8, true) / 65535;
    const c = [bytes[at + 10] / 255, bytes[at + 11] / 255, bytes[at + 12] / 255];
    const w = 0.5 + 1.6 * (1 - s0); // slow = thick, matching the collection
    for (const [p, q, tt, side] of [[px, nx, t0, +w], [px, nx, t0, -w], [nx, px, t1, +w], [nx, px, t1, -w]]) {
      positions.push(p[0], p[1], p[2]); next.push(q[0], q[1], q[2]);
      sides.push(side); colors.push(c[0], c[1], c[2]); times.push(tt); speeds.push(s0);
    }
    const v = vertexCount;
    indices.push(v, v + 1, v + 2, v + 2, v + 1, v + 3);
    vertexCount += 4;
  }
  bodyRanges[b] = [start, indices.length - start];
  cursor += count;
}

// ---- WebGL2 ----------------------------------------------------------------
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false });
if (!gl) document.body.textContent = "WebGL2 required.";
const VS = `#version 300 es
precision highp float;
in vec3 aPos; in vec3 aNext; in float aSide; in vec3 aColor; in float aTime; in float aSpeed;
uniform mat4 uProj, uView; uniform vec2 uViewport; uniform float uScale;
out vec3 vColor; out float vTime; out float vEdge; out float vSpeed;
void main() {
  vec4 p0 = uProj * uView * vec4(aPos * uScale, 1.0);
  vec4 p1 = uProj * uView * vec4(aNext * uScale, 1.0);
  vec2 s0 = p0.xy / p0.w, s1 = p1.xy / p1.w;
  vec2 dir = normalize((s1 - s0) * uViewport + vec2(1e-6));
  vec2 nrm = vec2(-dir.y, dir.x) / uViewport * 2.0;
  gl_Position = vec4(p0.xy + nrm * aSide * p0.w, p0.z, p0.w);
  vColor = aColor; vTime = aTime; vEdge = sign(aSide); vSpeed = aSpeed;
}`;
// Scope mode applies V54's beam law: dwell brightness ~ 1 / |v| inside a
// short trailing window behind the playhead, over the same geometry.
const FS = `#version 300 es
precision highp float;
in vec3 vColor; in float vTime; in float vEdge; in float vSpeed;
uniform float uTMax, uExposure, uScope, uTrail;
out vec4 frag;
void main() {
  if (vTime > uTMax) discard;
  float glow = exp(-2.4 * abs(vEdge));
  float base = 0.35 + 0.65 * glow;
  float age = uTMax - vTime;
  float trail = exp(-age / max(uTrail * 0.35, 1e-5));
  float dwell = 0.22 / (vSpeed + 0.035);
  float scope = (age > uTrail ? 0.0 : trail) * dwell * (0.2 + 0.8 * glow);
  frag = vec4(vColor * uExposure * mix(base, scope * 2.2, uScope), 1.0);
}`;
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
gl.useProgram(prog);
function buffer(data, attrib, size) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, attrib);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
}
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
buffer(positions, "aPos", 3); buffer(next, "aNext", 3);
buffer(sides, "aSide", 1); buffer(colors, "aColor", 3);
buffer(times, "aTime", 1); buffer(speeds, "aSpeed", 1);
const ibo = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(indices), gl.STATIC_DRAW);
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.disable(gl.DEPTH_TEST);

// ---- the instrument: WebAudio graph ----------------------------------------
// Three voices with V16's partial stack (1, 0.25, 0.12) at the embedded
// just-intonation ratios. Scrub velocity = bow pressure (gain + lowpass
// cutoff); consonance = reverb send. Latency budget: interactive hint plus
// 10 ms parameter smoothing, no lookahead scheduling.
let audio = null;
function ensureAudio() {
  if (audio) { if (audio.ctx.state === "suspended") audio.ctx.resume(); return audio; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
  const master = ctx.createGain(); master.gain.value = 0.9;
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -9; limiter.ratio.value = 12; limiter.attack.value = 0.002;
  master.connect(limiter).connect(ctx.destination);
  // Procedural reverb impulse: 2.2 s exponential noise tail (deterministic LCG).
  const irLen = Math.floor(ctx.sampleRate * 2.2);
  const ir = ctx.createBuffer(2, irLen, ctx.sampleRate);
  let state = 0x1234567;
  const rand = () => ((state = (state * 1664525 + 1013904223) >>> 0) / 4294967296) * 2 - 1;
  for (let ch = 0; ch < 2; ch++) {
    const data = ir.getChannelData(ch);
    for (let i = 0; i < irLen; i++) data[i] = rand() * Math.exp(-3.2 * i / irLen);
  }
  const reverb = ctx.createConvolver(); reverb.buffer = ir;
  const reverbGain = ctx.createGain(); reverbGain.gain.value = 0.0;
  reverb.connect(reverbGain).connect(master);
  // V16 partial stack as a periodic wave (imag = sine coefficients).
  const real = new Float32Array([0, 0, 0, 0]);
  const imag = new Float32Array([0, 1, 0.25, 0.12]);
  const wave = ctx.createPeriodicWave(real, imag, { disableNormalization: false });
  const voices = [];
  for (let v = 0; v < 3; v++) {
    const osc = ctx.createOscillator(); osc.setPeriodicWave(wave);
    osc.frequency.value = SCORE.root_hz;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 180; lp.Q.value = 0.6;
    const gain = ctx.createGain(); gain.gain.value = 0.0;
    const pan = ctx.createStereoPanner(); pan.pan.value = (v - 1) * 0.5;
    osc.connect(lp).connect(gain).connect(pan);
    pan.connect(master); pan.connect(reverb);
    osc.start();
    voices.push({ osc, lp, gain });
  }
  audio = { ctx, master, reverb, reverbGain, voices, recorder: null, chunks: [] };
  return audio;
}

// Active note per voice at run position t (V16 segments, hops domain).
function voiceRatioAt(v, t) {
  const hop = Math.min(SCORE.hops - 1, Math.max(0, Math.floor(t * SCORE.hops)));
  const segs = SCORE.voices[v];
  let lo = 0, hi = segs.length - 1, found = segs[segs.length - 1];
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (segs[mid][0] > hop) hi = mid - 1;
    else { found = segs[mid]; lo = mid + 1; }
  }
  return found;
}
function voiceFrequency(v, t) {
  const [, , num, den, octave] = voiceRatioAt(v, t);
  const oct = Math.max(-1, Math.min(1, octave));
  const f = SCORE.root_hz * num / den * Math.pow(2, oct);
  return Math.max(40, Math.min(2000, f));
}
function consonanceAt(t) {
  const hop = Math.min(consonance.length - 1, Math.max(0, Math.floor(t * consonance.length)));
  return consonance[hop];
}

// ---- bow model --------------------------------------------------------------
// Pressure follows |d position / dt| of the scrub; it decays when the bow
// lifts. All parameter moves are 10 ms setTargetAtTime ramps (clickless).
let bow = { pressure: 0, lastT: 0, lastMs: 0 };
const soloed = [false, false, false];
const enabled = [true, true, true];
function audibleGain(v) {
  const anySolo = soloed.some(s => s);
  const on = anySolo ? soloed[v] : enabled[v];
  return on ? 1 : 0;
}
function scrubTo(t, ms) {
  const a = ensureAudio();
  const slider = document.getElementById("time");
  t = Math.max(0, Math.min(1, t));
  slider.value = t;
  const dt = Math.max(1e-3, (ms - bow.lastMs) / 1000);
  const velocity = Math.abs(t - bow.lastT) / dt;      // run fractions per second
  bow.pressure = Math.min(1, velocity / 0.22);         // full traverse in ~4.5 s = max
  bow.lastT = t; bow.lastMs = ms;
  const now = a.ctx.currentTime;
  for (let v = 0; v < 3; v++) {
    const voice = a.voices[v];
    voice.osc.frequency.setTargetAtTime(voiceFrequency(v, t), now, 0.01);
    const level = (0.05 + 0.24 * Math.pow(bow.pressure, 1.5)) * audibleGain(v);
    voice.gain.gain.setTargetAtTime(bow.pressure > 0.005 ? level : 0, now, 0.01);
    voice.lp.frequency.setTargetAtTime(180 + 5200 * Math.pow(bow.pressure, 1.3), now, 0.01);
  }
  a.reverbGain.gain.setTargetAtTime(0.05 + 0.4 * consonanceAt(t), now, 0.03);
}
function bowDecay(ms) {
  // Called every frame: the bow lifts when no scrub events arrive.
  if (!audio) return;
  const idle = (ms - bow.lastMs) / 1000;
  if (idle < 0.06) return;
  bow.pressure *= Math.exp(-idle * 0.09);
  const now = audio.ctx.currentTime;
  for (let v = 0; v < 3; v++) {
    const level = (0.05 + 0.24 * Math.pow(bow.pressure, 1.5)) * audibleGain(v);
    audio.voices[v].gain.gain.setTargetAtTime(bow.pressure > 0.005 ? level : 0, now, 0.08);
  }
}

// ---- recording: MediaRecorder -> inline PCM WAV re-encode -------------------
async function toggleRecord() {
  const a = ensureAudio();
  const btn = document.getElementById("record");
  if (a.recorder && a.recorder.state === "recording") {
    a.recorder.stop();
    return;
  }
  const tapDest = a.ctx.createMediaStreamDestination();
  a.master.connect(tapDest);
  a.chunks = [];
  const rec = new MediaRecorder(tapDest.stream);
  rec.ondataavailable = e => { if (e.data.size) a.chunks.push(e.data); };
  rec.onstop = async () => {
    btn.classList.remove("hot");
    a.master.disconnect(tapDest);
    const blob = new Blob(a.chunks, { type: rec.mimeType });
    const decoded = await a.ctx.decodeAudioData(await blob.arrayBuffer());
    const wav = encodeWav(decoded);
    const url = URL.createObjectURL(new Blob([wav], { type: "audio/wav" }));
    const link = document.createElement("a");
    link.href = url; link.download = (META.seed || "orbit") + "_performance.wav";
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };
  a.recorder = rec;
  rec.start();
  btn.classList.add("hot");
}
function encodeWav(buffer) {
  // Interleave to 16-bit PCM, standard 44-byte RIFF header. No dependencies.
  const channels = Math.min(2, buffer.numberOfChannels);
  const frames = buffer.length;
  const out = new DataView(new ArrayBuffer(44 + frames * channels * 2));
  const write = (offset, text) => { for (let i = 0; i < text.length; i++) out.setUint8(offset + i, text.charCodeAt(i)); };
  write(0, "RIFF"); out.setUint32(4, 36 + frames * channels * 2, true); write(8, "WAVE");
  write(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true);
  out.setUint16(22, channels, true); out.setUint32(24, buffer.sampleRate, true);
  out.setUint32(28, buffer.sampleRate * channels * 2, true);
  out.setUint16(32, channels * 2, true); out.setUint16(34, 16, true);
  write(36, "data"); out.setUint32(40, frames * channels * 2, true);
  let offset = 44;
  for (let i = 0; i < frames; i++) {
    for (let ch = 0; ch < channels; ch++) {
      const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
      out.setInt16(offset, sample < 0 ? sample * 32768 : sample * 32767, true);
      offset += 2;
    }
  }
  return out.buffer;
}

// ---- camera + interaction ---------------------------------------------------
let yaw = 0.7, pitch = 0.32, dist = 2.6, autoOrbit = false, scopeMode = false;
canvas.addEventListener("pointerdown", e => {
  ensureAudio();
  if (e.button === 2) {           // right-drag orbits
    autoOrbit = false; setButton("orbit", false);
    const move = ev => { yaw += ev.movementX * 0.005; pitch = Math.max(-1.5, Math.min(1.5, pitch + ev.movementY * 0.005)); };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    return;
  }
  // Left-drag bows: horizontal motion scrubs time.
  const move = ev => {
    const t = parseFloat(document.getElementById("time").value) + ev.movementX / canvas.clientWidth;
    scrubTo(t, performance.now());
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
});
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("wheel", e => { dist = Math.max(0.6, Math.min(9, dist * Math.exp(e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });
document.getElementById("time").addEventListener("input", e => scrubTo(parseFloat(e.target.value), performance.now()));
function setButton(id, on) { document.getElementById(id).classList.toggle("off", !on); }
document.getElementById("orbit").onclick = () => { autoOrbit = !autoOrbit; setButton("orbit", autoOrbit); };
document.getElementById("scope").onclick = () => { scopeMode = !scopeMode; setButton("scope", scopeMode); };
document.getElementById("record").onclick = toggleRecord;
[0, 1, 2].forEach(b => { document.getElementById("b" + b).onclick = () => { enabled[b] = !enabled[b]; setButton("b" + b, enabled[b]); }; });
window.addEventListener("keydown", e => {
  if (e.key === "1" || e.key === "2" || e.key === "3") {
    const b = parseInt(e.key, 10) - 1;
    soloed[b] = !soloed[b];
    [0, 1, 2].forEach(v => setButton("b" + v, soloed.some(s => s) ? soloed[v] : enabled[v]));
  }
  if (e.key === "s" || e.key === "S") { scopeMode = !scopeMode; setButton("scope", scopeMode); }
  if (e.key === "r" || e.key === "R") toggleRecord();
});

function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
  return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
}
function lookAt(eye) {
  const z = norm(eye), x = norm(cross([0, 1, 0.0001], z)), y = cross(z, x);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
    -dot(x, eye), -dot(y, eye), -dot(z, eye), 1];
  function norm(v) { const l = Math.hypot(...v); return v.map(c => c / l); }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
}

// ---- render loop -------------------------------------------------------------
const uProj = gl.getUniformLocation(prog, "uProj");
const uView = gl.getUniformLocation(prog, "uView");
const uViewport = gl.getUniformLocation(prog, "uViewport");
const uScale = gl.getUniformLocation(prog, "uScale");
const uTMax = gl.getUniformLocation(prog, "uTMax");
const uExposure = gl.getUniformLocation(prog, "uExposure");
const uScope = gl.getUniformLocation(prog, "uScope");
const uTrail = gl.getUniformLocation(prog, "uTrail");
let scopeBlend = 0;
function frame(ms) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth * dpr | 0, h = canvas.clientHeight * dpr | 0;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.012, 0.012, 0.027, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (autoOrbit) yaw += 0.0022;
  bowDecay(ms);
  scopeBlend += ((scopeMode ? 1 : 0) - scopeBlend) * 0.12;
  // Scope eases to a top-down beam view (V54's stage).
  const effPitch = pitch + (1.47 - pitch) * scopeBlend;
  const eye = [dist * Math.cos(effPitch) * Math.sin(yaw), dist * Math.sin(effPitch), dist * Math.cos(effPitch) * Math.cos(yaw)];
  gl.uniformMatrix4fv(uProj, false, perspective(0.9, w / h, 0.05, 40));
  gl.uniformMatrix4fv(uView, false, lookAt(eye));
  gl.uniform2f(uViewport, w, h);
  gl.uniform1f(uScale, 2.0 / 65535.0);
  const t = parseFloat(document.getElementById("time").value);
  gl.uniform1f(uTMax, Math.max(t, 0.0008));
  gl.uniform1f(uExposure, parseFloat(document.getElementById("exposure").value));
  gl.uniform1f(uScope, scopeBlend);
  gl.uniform1f(uTrail, 0.045);
  gl.bindVertexArray(vao);
  const anySolo = soloed.some(s => s);
  for (let b = 0; b < bodyRanges.length; b++) {
    if (anySolo ? !soloed[b] : !enabled[b]) continue;
    gl.drawElements(gl.TRIANGLES, bodyRanges[b][1], gl.UNSIGNED_INT, bodyRanges[b][0] * 4);
  }
  // HUD meter.
  document.getElementById("pressure").textContent = bow.pressure.toFixed(2);
  const names = [0, 1, 2].map(v => { const seg = voiceRatioAt(v, t); return seg[2] + "/" + seg[3]; });
  document.getElementById("chord").textContent = names.join(" ");
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
